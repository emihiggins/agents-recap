[project]
name = "agent-recap"
version = "0.1.0"
description = "Local, offline recap and RAG memory of your AI coding sessions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["sqlite-vec>=0.1.9"]

[project.scripts]
agent-recap = "agent_recap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_recap"]
